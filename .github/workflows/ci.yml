name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test scripts/test/*.test.mjs
      - name: Bundle
        run: node scripts/bundle-skills.mjs
      - name: Validate skills and bundles
        run: node scripts/validate-skills.mjs
      - name: Check evals
        run: node scripts/check-evals.mjs
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Zip editions
        run: |
          cd dist
          zip -r ../ds-skills-folder.zip skills
          zip -r ../ds-skills-single.zip single
          zip -r ../ds-skills-slim.zip slim
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ds-skills-folder.zip
            ds-skills-single.zip
            ds-skills-slim.zip
